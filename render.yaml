services:
  # ─── Backend (FastAPI) ───────────────────────────────────────────────────
  - type: web
    name: svacs-backend
    env: python
    rootDir: backend
    # OCR model weights are now committed to git (ocr_models/).
    # No network download needed at build time.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --workers 1

  # ─── Frontend (Vite + React static site) ─────────────────────────────────
  - type: web
    name: svacs-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bhiv-svacs.onrender.com
      - key: VITE_USE_MOCK
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
