services:
  - type: web
    name: svacs-backend
    env: python
    rootDir: backend
    # Build step: install deps AND pre-download EasyOCR models into ocr_models/.
    # The build environment has no RAM cap, so the download is safe here.
    # At runtime, ocr_service.py reads from ocr_models/ with download_enabled=False
    # — no network calls during the 512 MB container startup.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --workers 1
